name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build portable onefile EXE (always elevated)
      run: |
        pyinstaller --noconfirm --onefile --windowed --uac-admin --name LagSlice --icon assets/lagslice.ico --add-data "assets/lagslice-logo.png;." --add-data "docs/about-dialog-fa.txt;docs" --add-data "assets/fonts;fonts" --collect-all PyQt6 app/main.py

    - name: Build source archive (AGPL Corresponding Source)
      shell: pwsh
      run: |
        $ver = (Get-Content version.txt -Raw).Trim()
        $zip = "dist/LagSlice-source-v$ver.zip"
        $files = @("app","assets","docs","main.py","requirements.txt","LICENSE","THIRD_PARTY_NOTICES","README.md","version.txt")
        Compress-Archive -Path $files -DestinationPath $zip -Force

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: LagSlice-win
        path: dist/LagSlice.exe

    - name: Upload source archive + third-party notices
      uses: actions/upload-artifact@v4
      with:
        name: LagSlice-source
        path: |
          dist/LagSlice-source-*.zip
          THIRD_PARTY_NOTICES
