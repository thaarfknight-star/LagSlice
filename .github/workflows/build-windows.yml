name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build portable onefile EXE (always elevated)
      run: |
        pyinstaller --noconfirm --onefile --windowed --uac-admin --name LagSlice --icon assets/lagslice.ico --add-data "assets/lagslice-logo.png;." --add-data "docs/about-dialog-fa.txt;docs" --add-data "docs/lagslice-help-fa.pdf;docs" --add-data "assets/fonts;fonts" --collect-all PyQt6 app/main.py

    - name: Build source archive (AGPL Corresponding Source)
      shell: pwsh
      run: |
        $ver = (Get-Content version.txt -Raw).Trim()
        $zip = "dist/LagSlice-source-v$ver.zip"
        $files = @("app","assets","docs","main.py","requirements.txt","LICENSE","THIRD_PARTY_NOTICES","README.md","version.txt")
        Compress-Archive -Path $files -DestinationPath $zip -Force

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: LagSlice-win
        path: dist/LagSlice.exe

    - name: Upload source archive + third-party notices
      uses: actions/upload-artifact@v4
      with:
        name: LagSlice-source
        path: |
          dist/LagSlice-source-*.zip
          THIRD_PARTY_NOTICES

  release:
    name: Auto-release on version bump (AGPL)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Read version
      id: ver
      shell: pwsh
      run: |
        $v = (Get-Content version.txt -Raw).Trim()
        "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Check if release already exists
      id: chk
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view "v${{ steps.ver.outputs.version }}" --json tagName >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download EXE artifact
      if: steps.chk.outputs.exists == 'false'
      uses: actions/download-artifact@v4
      with:
        name: LagSlice-win
        path: rel-assets/win

    - name: Download source artifacts
      if: steps.chk.outputs.exists == 'false'
      uses: actions/download-artifact@v4
      with:
        name: LagSlice-source
        path: rel-assets/src

    - name: Create GitHub Release
      if: steps.chk.outputs.exists == 'false'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ver = "${{ steps.ver.outputs.version }}"
        $notes = @"
        LagSlice v$ver — بهینه‌ساز استریم (ویندوز)

        اجرا: فایل LagSlice.exe را دانلود و با Run as administrator اجرا کنید.
        Run: download LagSlice.exe and run as administrator.

        سورس‌کد همین نسخه + اعلامیه‌های شخص ثالث ضمیمه شده است (تعهد AGPL-3.0).
        Corresponding source + third-party notices attached (AGPL-3.0).
        "@
        gh release create "v$ver" --title "LagSlice v$ver" --notes $notes `
          (Get-ChildItem -Path rel-assets -Filter "LagSlice.exe" -Recurse | Select-Object -First 1).FullName `
          (Get-ChildItem -Path rel-assets -Filter "LagSlice-source-*.zip" -Recurse | Select-Object -First 1).FullName `
          (Get-ChildItem -Path rel-assets -Filter "THIRD_PARTY_NOTICES" -Recurse | Select-Object -First 1).FullName
