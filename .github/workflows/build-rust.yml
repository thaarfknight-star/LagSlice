name: Build LagSlice (Rust + Tauri)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build and publish draft release (NSIS Setup)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: lagslice-rs-v__VERSION__
          releaseName: "LagSlice (Rust) v__VERSION__"
          releaseBody: "نسخه‌ی Rust + Tauri — فایل Setup (NSIS) و exe پرتابل در فایل‌های زیر هستند."
          releaseDraft: true
          prerelease: false
